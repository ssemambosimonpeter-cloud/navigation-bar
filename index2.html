<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            
        }
        .nav ul{
            text-decoration: none;
            padding: 0px;
            list-style-type: none;
            background-color: blue;
            overflow: hidden;


        }
        .nav a{
            display: block;
            padding: 20px;

        }
        .nav li{
            float: left;
        }
        .nav a:hover{
            background-color: azure;
            
        }
    </style>
</head>
<body>
    <nav class="nav">
        <ul>
            <li><a>HOME</a></li>
             <li><a>ABOUT</a></li>
              <li><a>CONTACTS</a></li>
               <li><a>PRODUCTS</a></li>
        </ul>
        
    </nav>
   
</body>
</html>
